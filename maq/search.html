<style>

[data-theme="light"]{--bg:#f7f7f5;--card:#ffffff;--text:#2c2c2a;--muted:#6b6a65;--line:#e3e2dd;--accent:#1a7f5a;--link:#534ab7}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.78}

.sub{font-size:13.5px;color:var(--muted);margin-bottom:6px}
.sbox{position:relative;display:inline-flex;align-items:center;margin-left:10px}
.sbox input{background:var(--card);border:1px solid var(--line);color:inherit;border-radius:6px;padding:4px 9px 4px 25px;font-size:13px;width:170px;font-family:inherit;outline:none}
.sbox input:focus{border-color:var(--accent);width:220px}
.sbox .si{position:absolute;left:8px;font-size:12px;opacity:.6;pointer-events:none}
.spanel{display:none;position:absolute;top:calc(100% + 6px);right:0;width:440px;max-width:88vw;max-height:64vh;overflow-y:auto;z-index:900;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.45);padding:6px}
.spanel.open{display:block}
.spanel .sh{padding:7px 10px;font-size:12px;opacity:.7;border-bottom:1px solid var(--line);margin-bottom:4px}
.spanel .sempty{font-size:12px;opacity:.65;padding:16px 10px;text-align:center}
.sres{display:block;padding:7px 10px;border-radius:7px;text-decoration:none;color:inherit}
.sres:hover,.sres.sel{background:var(--bg)}
.sres .c{font-size:11px;opacity:.65;margin-bottom:1px}
.sres .s{font-size:12px;color:var(--accent);margin-bottom:2px}
.sres .t{font-size:13px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sres mark{background:rgba(255,200,0,.35);color:inherit;border-radius:2px;padding:0 1px}
.srch-main{margin:22px 0}
.srch-main input{width:100%;background:var(--card);border:1px solid var(--line);color:inherit;border-radius:8px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none}
.srch-meta{font-size:13px;opacity:.7;margin:12px 0 6px}
.srch-list{list-style:none;margin:0;padding:0}
